services:
  gotunnel-server:
    image: ${GOTUNNEL_IMAGE:-gotunnel-server:latest}
    platform: ${GOTUNNEL_PLATFORM:-linux/amd64}
    container_name: gotunnel-server
    restart: unless-stopped
    command:
      - -control
      - ${GOTUNNEL_CONTROL_ADDR:-:6000}
      - -debug=${GOTUNNEL_DEBUG:-false}
    ports:
      # Control port: client connects here
      - "${GOTUNNEL_CONTROL_PORT:-6000}:6000"
      # Visitor ports: configured per tunnel, exposed from .env
      # SSH tunnel
      - "${GOTUNNEL_SSH_VISITOR_PORT:-2222}:${GOTUNNEL_SSH_VISITOR_PORT:-2222}"
      # RDP tunnel
      - "${GOTUNNEL_RDP_VISITOR_PORT:-3389}:${GOTUNNEL_RDP_VISITOR_PORT:-3389}"
      # VNC tunnel (optional)
      # - "${GOTUNNEL_VNC_VISITOR_PORT:-5900}:${GOTUNNEL_VNC_VISITOR_PORT:-5900}"
